<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Secure File Vault</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2>🔐 Vault</h2>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout" class="logout">Logout</a>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Manage your encrypted cloud files.</p>
                </div>
            </div>

            <div class="upload-card">
                <h3>Upload New File</h3>
                <form method="POST" action="/upload" enctype="multipart/form-data">
                    <input type="file" name="file" required>
                    <button type="submit">Encrypt & Upload</button>
                </form>
            </div>

            <div class="table-card">
                <h3>Your Files</h3>

                {% if files %}
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>File Name</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for file in files %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>📄 {{ file[1] }}</td>
                            <td><span class="status">Encrypted</span></td>
                            <td>
                                <a href="/download/{{ file[0] }}" class="action download">Download</a>
                                <a href="/delete/{{ file[0] }}" class="action delete" onclick="return confirm('Are you sure you want to delete this file?');">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                    <p>No files uploaded yet.</p>
                {% endif %}
            </div>
        </main>
    </div>
</body>
</html>
