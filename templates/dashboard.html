<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Secure File Vault</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>User Dashboard</h2>
        <p>Upload your file securely to AWS S3.</p>

        <form method="POST" action="/upload" enctype="multipart/form-data">
            <input type="file" name="file" required><br><br>
            <button type="submit">Encrypt & Upload</button>
        </form>

        <h3>Your Files</h3>

        {% if files %}
            {% for file in files %}
                <p>
                    {{ file[1] }}
                    <br>
                    <a href="/download/{{ file[0] }}">Download</a>
                    <a href="/delete/{{ file[0] }}" onclick="return confirm('Are you sure you want to delete this file?');">Delete</a>
                </p>
            {% endfor %}
        {% else %}
            <p>No files uploaded yet.</p>
        {% endif %}

        <br>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
